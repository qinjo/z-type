[workspace]
resolver = "2"
members = ["crates/qieyun-kit", "crates/qieyun-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/OWNER/z-type"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
sha2 = "0.10"
