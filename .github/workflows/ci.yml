name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: cargo fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  web:
    name: pnpm build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  contract-macos:
    name: 契约测试（真实 librime 部署 + 读回 build/）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 准备 librime（官方预编译包）
        run: ./scripts/build-librime-macos.sh
      - name: GUI 写出的 patch 必须被 librime 接受
        run: |
          QIEYUN_RIME_DEPLOYER="$PWD/.deps/librime-prebuilt/dist/bin/rime_deployer" \
            cargo test -p qieyun-kit --test deploy_contract -- --nocapture
      - name: 进程内引擎（FFI）打字闭环
        run: cargo test -p qieyun-ffi -- --nocapture
      - name: Tauri 后端（含引擎单例与 rpath）
        working-directory: apps/desktop/src-tauri
        run: cargo test -- --nocapture
