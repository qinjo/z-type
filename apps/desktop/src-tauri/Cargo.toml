[package]
name = "qieyun-studio"
version = "0.1.0"
description = "切韵 — 跨平台 Rime 输入法可视化配置工作台（Tauri 桌面壳）"
authors = ["Qieyun contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 独立的 Cargo workspace：避免被仓库根目录的 workspace 意外吸纳/误构建。
# 前端构建（pnpm build）不依赖本目录；cargo 构建由 lead 在根 workspace 统一处理。
[workspace]
